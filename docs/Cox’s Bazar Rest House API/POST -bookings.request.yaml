$kind: http-request
name: POST /bookings
description: "Authenticated active staff/admin. Requires Idempotency-Key; reuse only for the same request body. "
url: "{{base_url}}/api/v1/bookings"
method: POST
headers:
  Accept: application/json
  Idempotency-Key: "{{request_idempotency_key}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "guest_id": 1,
      "guest_category_id": 1,
      "room_ids": [
        1
      ],
      "check_in_at": "2027-01-01T14:00:00+06:00",
      "check_out_at": "2027-01-05T12:00:00+06:00",
      "reference_letter": "Example reference_letter",
      "guest_count": 1,
      "notes": ""
    }
scripts:
  - type: beforeRequest
    code: pm.variables.set("request_idempotency_key", pm.collectionVariables.get("retry_idempotency_key") || pm.variables.replaceIn("{{$guid}}"));
    language: text/javascript
  - type: afterResponse
    code: if(pm.response.code<300){const d=pm.response.json().data;if(d && d.id && d.version){pm.collectionVariables.set("booking_id",d.id);pm.collectionVariables.set("booking_version",d.version);}}
    language: text/javascript
order: 59000
