$kind: http-request
name: POST /users
description: "Administrator only. Requires Idempotency-Key; reuse only for the same request body. "
url: "{{base_url}}/api/v1/users"
method: POST
headers:
  Accept: application/json
  Idempotency-Key: "{{request_idempotency_key}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Example Guest",
      "email": "guest@example.test",
      "role": "admin",
      "active": false,
      "password": "{{new_password}}"
    }
scripts:
  - type: beforeRequest
    code: pm.variables.set("request_idempotency_key", pm.collectionVariables.get("retry_idempotency_key") || pm.variables.replaceIn("{{$guid}}"));
    language: text/javascript
order: 87000
