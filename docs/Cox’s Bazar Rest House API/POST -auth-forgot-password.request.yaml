$kind: http-request
name: POST /auth/forgot-password
description: "Public endpoint. "
url: "{{base_url}}/api/v1/auth/forgot-password"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email}}"
    }
auth:
  type: noauth
order: 53000
