$kind: http-request
name: POST /booking-amendments/{id}/approve
description: "Administrator only. Requires Idempotency-Key; reuse only for the same request body. "
url: "{{base_url}}/api/v1/booking-amendments/{{id}}/approve"
method: POST
headers:
  Accept: application/json
  Idempotency-Key: "{{request_idempotency_key}}"
  Content-Type: application/json
body:
  type: json
  content: "{}"
scripts:
  - type: beforeRequest
    code: pm.variables.set("request_idempotency_key", pm.collectionVariables.get("retry_idempotency_key") || pm.variables.replaceIn("{{$guid}}"));
    language: text/javascript
order: 56000
