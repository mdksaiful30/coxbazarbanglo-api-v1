$kind: http-request
name: POST /tariffs/{id}/activate
description: "Administrator only. Requires Idempotency-Key; reuse only for the same request body. "
url: "{{base_url}}/api/v1/tariffs/{{id}}/activate"
method: POST
headers:
  Accept: application/json
  Idempotency-Key: "{{request_idempotency_key}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "calculation_mode": "progressive",
      "effective_from": "2027-01-01",
      "check_in_time": "14:00",
      "check_out_time": "12:00",
      "turnaround_minutes": 1,
      "notification_channel": "email",
      "policy_acknowledged": true,
      "reason": "Approved office correction"
    }
scripts:
  - type: beforeRequest
    code: pm.variables.set("request_idempotency_key", pm.collectionVariables.get("retry_idempotency_key") || pm.variables.replaceIn("{{$guid}}"));
    language: text/javascript
order: 85000
